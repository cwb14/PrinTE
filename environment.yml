# Runtime environment for all of PrinTE: the simulator, the grid search, and the R
# scripts in R/ (Track 1 ancestral reconstruction and the R plotters).
name: PrinTE
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  - biopython >=1.80
  - matplotlib-base >=3.7
  - numpy >=1.24
  - pandas >=2.0
  - pysam >=0.21
  - scikit-learn >=1.3       # guided_search surrogate model, contour_plot importances
  - scipy >=1.10
  - seaborn >=0.12
  - blast                    # seq_divergence.py
  - samtools                 # R/ancestral_reconstruction_gs.R
  - minimap2                 # util/plot_indel.py
  - cxx-compiler             # builds ltr_mutator on first run, no root needed
  # R/ scripts. ancestral_reconstruction_ltr_age.R also calls PrinTE's Python, which is
  # why these share one environment.
  - r-base >=4.2
  - r-ape
  - r-phytools
  - r-optparse
  - r-ggplot2
  - r-dplyr
  - r-tidyr
  - r-stringr
  - r-viridis
  - bioconductor-ggtree
  # Used by Kmer2LTR and synLTR, which PrinTE calls during post-processing rather
  # than by PrinTE itself. Drop them if you skip post-processing (--no_postproc).
  - mafft
  - trimal
  - kmer-jellyfish
