# Runtime environment for the simulator and the grid search.
#
# The R stack for Track 1 ancestral reconstruction lives in environment-r.yml. It is
# kept separate because it roughly doubles the install size and only that one step
# and the R plotters need it.
name: PrinTE
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10
  - biopython >=1.80
  - matplotlib-base >=3.7
  - numpy >=1.24
  - pandas >=2.0
  - pysam >=0.21
  - scikit-learn >=1.3       # guided_search surrogate model, contour_plot importances
  - scipy >=1.10
  - seaborn >=0.12
  - blast                    # seq_divergence.py
  - samtools                 # R/ancestral_reconstruction_gs.R
  - minimap2                 # util/plot_indel.py
  - cxx-compiler             # builds ltr_mutator on first run, no root needed
  # Used by Kmer2LTR and synLTR, which PrinTE calls during post-processing rather
  # than by PrinTE itself. Drop them if you skip post-processing (--no_postproc).
  - mafft
  - trimal
  - kmer-jellyfish
